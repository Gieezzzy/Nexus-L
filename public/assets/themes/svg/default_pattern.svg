<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" opacity="0.06">
  <defs>
    <pattern id="rms-pattern" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Chat Bubble -->
      <path d="M30 40 h50 a15 15 0 0 1 15 15 v25 a15 15 0 0 1 -15 15 h-35 l-15 10 v-10 h0 a15 15 0 0 1 -15 -15 v-25 a15 15 0 0 1 15 -15 z" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="50" cy="67" r="3" fill="#1e293b"/>
      <circle cx="65" cy="67" r="3" fill="#1e293b"/>
      <circle cx="80" cy="67" r="3" fill="#1e293b"/>

      <!-- Paper Plane -->
      <path d="M140 30 l40 18 -18 40 -12 -18 -10 10 z" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- Checkmark Shield (Audit) -->
      <path d="M40 140 v20 c0 20 25 35 25 35 s25 -15 25 -35 v-20 l-25 -10 z" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M55 160 l7 7 15 -15" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Star -->
      <polygon points="150,130 154,142 166,142 156,150 160,162 150,154 140,162 144,150 134,142 146,142" fill="none" stroke="#1e293b" stroke-width="2"/>

      <!-- Clock / History -->
      <circle cx="150" cy="80" r="14" fill="none" stroke="#1e293b" stroke-width="2"/>
      <polyline points="150,72 150,80 156,84" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

      <!-- Sparkle / Asterisk -->
      <line x1="95" y1="125" x2="105" y2="125" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <line x1="100" y1="120" x2="100" y2="130" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#rms-pattern)"/>
</svg>
